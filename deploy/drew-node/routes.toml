# Colour Memory: 7 doors under g.drew.colour, generated by `toon-checkout routes`.
# One door per price: the connector refuses one handler_url at two prices, and a
# reject is still charged, so each door sells exactly what its path delivers.
# handler_url carries a path: the envelope's target resolves beneath it.

# Match a hex colour to the archive (POST /query/hex)
[[routes]]
prefix = "g.drew.colour.query_hex"
handler_url = "http://colour-forwarder:3700/query/hex"
price = 1000

# Search the archive by concept (POST /query/conceptual)
[[routes]]
prefix = "g.drew.colour.query_conceptual"
handler_url = "http://colour-forwarder:3700/query/conceptual"
price = 1000

# Keyword search across the archives (POST /archive/search)
[[routes]]
prefix = "g.drew.colour.archive_search"
handler_url = "http://colour-forwarder:3700/archive/search"
price = 1000

# WCAG matrix for a palette (POST /accessibility/matrix)
[[routes]]
prefix = "g.drew.colour.accessibility_matrix"
handler_url = "http://colour-forwarder:3700/accessibility/matrix"
price = 1000

# Can this brand own this colour? (POST /brand/collision-check)
[[routes]]
prefix = "g.drew.colour.brand_collision"
handler_url = "http://colour-forwarder:3700/brand/collision-check"
price = 30000

# Product copy for a colour (POST /ecommerce/product-copy)
[[routes]]
prefix = "g.drew.colour.ecommerce_copy"
handler_url = "http://colour-forwarder:3700/ecommerce/product-copy"
price = 30000

# Forensic colour brief (POST /brief/forensic)
[[routes]]
prefix = "g.drew.colour.brief_forensic"
handler_url = "http://colour-forwarder:3700/brief/forensic"
price = 90000
